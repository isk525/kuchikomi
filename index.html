<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>KUCHIKOMI</title><link rel="manifest" href="manifest.json?v=1.0.3"><link id="css" rel="stylesheet" href="style.css?v=1.3.0"></head><body>
<header><div class="brand"><h1>KUCHIKOMI</h1><small>自分の「よかった」を記録・共有</small></div><div class="head-actions"><div class="version"><span>Ver 1.3.0</span><button id="update">更新確認</button></div><button id="profile" class="icon">👤</button><button id="new" class="post">＋投稿</button></div></header>
<main>
<section id="timelineView"><div class="toolbar"><div class="filters" id="timelineFilters"><button class="filter on" data-filter="all">すべて</button><button class="filter" data-filter="ramen">🍜</button><button class="filter" data-filter="movie">🎬</button></div><div class="density" aria-label="表示切替"><button class="densityBtn on" data-density="1">1列</button><button class="densityBtn" data-density="2">2列</button><button class="densityBtn" data-density="4">4列</button></div></div><p id="status">接続中...</p><div id="timeline" class="review-grid density-1"></div></section>
<section id="calendarView" class="hidden"><div class="filters" id="calendarFilters"><button class="calFilter on" data-filter="all">すべて</button><button class="calFilter" data-filter="ramen">🍜 ラーメン</button><button class="calFilter" data-filter="movie">🎬 映画</button></div><div class="calendar-head"><button id="prevMonth">‹</button><h2 id="monthLabel"></h2><button id="nextMonth">›</button></div><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="calendar-grid"></div><h3 id="selectedDateLabel"></h3><div id="dayReviews" class="review-grid density-1"></div></section>
<section id="profileView" class="hidden"><div class="screen-head"><button class="back">←</button><h2>プロフィール</h2></div><div class="profile-card"><b id="avatar">?</b><div><h2 id="profileName">未登録</h2><p id="profileBioText">プロフィールを登録してください</p></div><button id="editProfile">編集</button></div><div id="profileForm" class="panel hidden"><label>表示名<input id="displayName" maxlength="20"></label><label>自己紹介<textarea id="bio" maxlength="80"></textarea></label><button id="saveProfile" class="primary">保存</button></div><div class="stats"><div><b id="total">0</b><small>合計</small></div><div><b id="ramenCount">0</b><small>ラーメン</small></div><div><b id="movieCount">0</b><small>映画</small></div></div><h3>自分のレビュー</h3><div id="mine" class="review-grid density-1"></div></section>
<section id="editor" class="hidden"><div class="screen-head"><button class="back">←</button><h2 id="editorTitle">レビューを投稿</h2></div><div class="panel"><div class="genres"><button class="genre on" data-type="ramen">🍜 ラーメン</button><button class="genre" data-type="movie">🎬 映画</button></div><input id="type" type="hidden" value="ramen"><label><span id="titleLabel">店名</span><input id="title" maxlength="120"></label><label><span id="dateLabel">食べた日</span><input id="reviewDate" type="date"></label><label>総合評価</label><div id="stars" class="stars" aria-label="0.5刻み評価"></div><div id="ratingText">未選択</div><div id="options"></div><label>写真（任意）</label><button id="pickImage" class="image-pick">📷 写真を選択<small>自動圧縮して保存</small></button><input id="imageInput" type="file" accept="image/*" class="hidden"><div id="previewWrap" class="preview hidden"><img id="preview"><button id="removeImage">削除</button></div><label>ひとこと<textarea id="note" maxlength="300"></textarea></label><p id="error" class="error hidden"></p><button id="cancelEdit" class="secondary hidden">編集を取り消す</button><button id="save" class="primary">投稿する</button></div></section>
</main><nav id="bottomNav"><button class="navBtn on" data-view="timeline">▤<small>タイムライン</small></button><button class="navBtn" data-view="calendar">▦<small>カレンダー</small></button></nav>
<div id="detail" class="sheet hidden"><div class="sheet-card"><button id="closeDetail" class="sheet-close">×</button><div id="detailBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script type="module">let v="1.3.0";try{const r=await fetch(`version.json?t=${Date.now()}`,{cache:"no-store"});if(r.ok)v=(await r.json()).version||v}catch{}document.getElementById("css").href=`style.css?v=${v}`;await import(`app.js?v=${v}`)</script></body></html>
