<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <title>KUCHIKOMI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <h1>KUCHIKOMI</h1>
        <p>みんなのラーメン・映画レビュー</p>
      </div>
      <button id="newBtn" class="header-button" type="button">＋ 投稿</button>
    </header>

    <main class="page">
      <section id="timelineScreen">
        <div class="filter-row" role="group" aria-label="タイムライン絞り込み">
          <button class="filter-button active" type="button" data-filter="all">すべて</button>
          <button class="filter-button" type="button" data-filter="ramen">🍜 ラーメン</button>
          <button class="filter-button" type="button" data-filter="movie">🎬 映画</button>
        </div>
        <div id="status" class="status">接続中...</div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section id="reviewScreen" class="hidden">
        <div class="screen-title-row">
          <button id="closeBtn" class="icon-button" type="button" aria-label="戻る">←</button>
          <div>
            <h2>レビューを投稿</h2>
            <p>選ぶだけで、かんたん記録</p>
          </div>
        </div>

        <div class="form-card">
          <label for="nickname">ニックネーム</label>
          <input id="nickname" maxlength="20" placeholder="例：Yutaka" autocomplete="nickname">

          <label>ジャンル</label>
          <div class="genre-switch">
            <button id="ramenTypeBtn" class="genre-button active" type="button" data-type="ramen">🍜 ラーメン</button>
            <button id="movieTypeBtn" class="genre-button" type="button" data-type="movie">🎬 映画</button>
          </div>
          <input id="type" type="hidden" value="ramen">

          <label id="titleLabel" for="title">店名</label>
          <input id="title" maxlength="120" placeholder="店名を入力" autocomplete="off">
          <div id="suggestions" class="suggestions hidden"></div>
          <p id="masterHint" class="hint">候補にない店名は、そのまま投稿すると辞書へ自動登録されます。</p>

          <label>総合評価</label>
          <div id="stars" class="stars" role="radiogroup" aria-label="5段階評価">
            <button class="star-button" type="button" data-rating="1" aria-label="1点">★</button>
            <button class="star-button" type="button" data-rating="2" aria-label="2点">★</button>
            <button class="star-button" type="button" data-rating="3" aria-label="3点">★</button>
            <button class="star-button" type="button" data-rating="4" aria-label="4点">★</button>
            <button class="star-button" type="button" data-rating="5" aria-label="5点">★</button>
            <span id="ratingText">未選択</span>
          </div>

          <div id="reviewOptions"></div>

          <label for="note">ひとこと（任意）</label>
          <textarea id="note" maxlength="300" placeholder="補足があれば入力"></textarea>
          <div class="counter"><span id="noteCount">0</span>/300</div>

          <div id="formError" class="error hidden"></div>
          <button id="saveBtn" class="primary-button" type="button">タイムラインに投稿</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-card">
      <h3 id="confirmTitle">レビューを削除しますか？</h3>
      <p>削除後は元に戻せません。</p>
      <div class="modal-actions">
        <button id="cancelDeleteBtn" class="secondary-button" type="button">キャンセル</button>
        <button id="confirmDeleteBtn" class="danger-button" type="button">削除</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
